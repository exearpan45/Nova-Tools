    <script>
      (function() {
        function applyInitialTheme() {
          try {
            var t = localStorage.getItem('novatools_theme');
            var isDark = t ? (t === 'dark') : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            var doc = document.documentElement;
            doc.classList.add('no-transitions');
            if (isDark) {
              doc.classList.add('dark');
              doc.classList.remove('light');
              doc.style.setProperty('background-color', '#121214', 'important');
              doc.style.setProperty('color-scheme', 'dark', 'important');
            } else {
              doc.classList.remove('dark');
              doc.classList.add('light');
              doc.style.setProperty('background-color', '#ffffff', 'important');
              doc.style.setProperty('color-scheme', 'light', 'important');
            }
          } catch(e) {}
        }
        applyInitialTheme();
        var releaseTransitions = function() {
          setTimeout(function() {
            if (document.documentElement) {
              document.documentElement.classList.remove('no-transitions');
            }
          }, 80);
        };
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', releaseTransitions, { once: true });
        } else {
          releaseTransitions();
        }
      })();
    </script>

    <!-- Single Page App query redirect decoder for GitHub Pages & static hosting -->
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>

    <style id="nova-critical-theme">
      :root { color-scheme: dark light; }
      .no-transitions,
      .no-transitions *,
      .no-transitions *::before,
      .no-transitions *::after {
        -webkit-transition: none !important;
        -moz-transition: none !important;
        -o-transition: none !important;
        transition: none !important;
      }
      html.dark, html.dark body {
        background-color: #121214 !important;
        color: #f5f5f5 !important;
        color-scheme: dark !important;
      }
      html.light, html.light body {
        background-color: #ffffff !important;
        color: #171717 !important;
        color-scheme: light !important;
      }
      @media (prefers-color-scheme: dark) {
        html:not(.light), html:not(.light) body {
          background-color: #121214;
          color: #f5f5f5;
          color-scheme: dark;
        }
      }
      @media (prefers-color-scheme: light) {
        html:not(.dark), html:not(.dark) body {
          background-color: #ffffff;
          color: #171717;
          color-scheme: light;
        }
      }
    </style>
