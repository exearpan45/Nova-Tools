    <script>
      (function() {
        function applyInitialTheme() {
          try {
            var stored = localStorage.getItem('nova_v2_settings');
            var settings = stored ? JSON.parse(stored) : null;
            var preference = settings && settings.theme ? settings.theme : localStorage.getItem('novatools_theme');
            var isDark = preference === 'system' || !preference
              ? !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
              : preference === 'dark';
            var doc = document.documentElement;
            doc.classList.add('no-transitions');
            doc.classList.toggle('dark', isDark);
            doc.classList.toggle('light', !isDark);
            doc.style.setProperty('background-color', isDark ? '#080D1C' : '#f8fafc', 'important');
            doc.style.setProperty('color-scheme', isDark ? 'dark' : 'light', 'important');
          } catch(e) {}
        }
        applyInitialTheme();
        var releaseTransitions = function() {
          setTimeout(function() {
            if (document.documentElement) document.documentElement.classList.remove('no-transitions');
          }, 80);
        };
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', releaseTransitions, { once: true });
        else releaseTransitions();
      })();
    </script>
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) { return s.replace(/~and~/g, '&'); }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location));
    </script>
