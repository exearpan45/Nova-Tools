    <!-- Critical Pre-paint Theme CSS: Instant Native Canvas & Background Before Any Script or File Loads -->
    <style id="nova-critical-theme">
      :root {
        color-scheme: dark light;
      }
      html {
        background-color: #ffffff;
        color: #171717;
      }
      html.dark {
        background-color: #121214 !important;
        color: #f5f5f5 !important;
        color-scheme: dark;
      }
      html.dark body {
        background-color: #121214 !important;
        color: #f5f5f5 !important;
      }
      html.light {
        background-color: #ffffff !important;
        color: #171717 !important;
        color-scheme: light;
      }
      html.light body {
        background-color: #ffffff !important;
        color: #171717 !important;
      }
      @media (prefers-color-scheme: dark) {
        html:not(.light) {
          background-color: #121214;
          color: #f5f5f5;
          color-scheme: dark;
        }
        html:not(.light) body {
          background-color: #121214;
          color: #f5f5f5;
        }
      }
    </style>

    <!-- Pre-paint Theme Initialization: Eliminates Light/Dark Flash Before Render -->
    <script id="nova-critical-theme-script">
      (function() {
        function applyInitialTheme() {
          try {
            var saved = localStorage.getItem('novatools_theme');
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            var isDark = saved ? (saved === 'dark') : prefersDark;
            var docEl = document.documentElement;
            if (isDark) {
              docEl.classList.add('dark');
              docEl.classList.remove('light');
              docEl.style.backgroundColor = '#121214';
              docEl.style.colorScheme = 'dark';
            } else {
              docEl.classList.remove('dark');
              docEl.classList.add('light');
              docEl.style.backgroundColor = '#ffffff';
              docEl.style.colorScheme = 'light';
            }
            var metaThemeColor = document.querySelector('meta[name="theme-color"]');
            if (metaThemeColor) {
              metaThemeColor.setAttribute('content', isDark ? '#121214' : '#ffffff');
            }
          } catch (e) {}
        }

        // Apply immediately during HTML parsing
        applyInitialTheme();

        // Enforce with requestAnimationFrame if available before first layout/paint pass
        if (typeof window !== 'undefined' && 'requestAnimationFrame' in window) {
          window.requestAnimationFrame(applyInitialTheme);
        }
      })();
    </script>
