name: Deploy NOVA TOOLS to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        timeout-minutes: 10
        env:
          npm_config_fetch_retries: '5'
          npm_config_fetch_retry_factor: '2'
          npm_config_fetch_retry_mintimeout: '2000'
          npm_config_fetch_retry_maxtimeout: '30000'
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Verify dependencies
        run: npm --version && node --version && test -d node_modules/vite && test -d node_modules/react

      - name: Build
        env:
          GITHUB_PAGES: 'true'
        run: npm run build

      - name: Verify Pages output
        run: |
          test -s dist/index.html
          test -f dist/404.html
          test -f dist/CNAME
          grep -qx 'novatools.2bd.net' dist/CNAME
          test -f dist/.nojekyll
          test -f dist/sitemap.xml
          test -f dist/tools/calculator/index.html
          test -f dist/tools/password-generator/index.html
          test -f dist/tools/qr-generator/index.html
          grep -q 'https://novatools.2bd.net/' dist/sitemap.xml
          if grep -RIl 'https://novatools.net/' dist public >/tmp/old-domain-files.txt 2>/dev/null; then
            echo "ERROR: old novatools.net URL found in deployable files:"
            cat /tmp/old-domain-files.txt
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
