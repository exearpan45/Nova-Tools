name: Deploy NOVA TOOLS to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Queue deployments instead of cancelling an in-progress run when commits arrive quickly.
  # This keeps every push independently traceable and avoids false 'cancelled' runs.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        timeout-minutes: 10
        env:
          npm_config_fetch_retries: '5'
          npm_config_fetch_retry_factor: '2'
          npm_config_fetch_retry_mintimeout: '2000'
          npm_config_fetch_retry_maxtimeout: '30000'
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Verify dependencies
        run: npm --version && node --version && test -d node_modules/vite && test -d node_modules/react

      - name: Build
        env:
          GITHUB_PAGES: 'true'
        run: npm run build

      - name: Preserve custom domain in Pages artifact
        run: |
          test -f CNAME
          test "$(tr -d '\r\n' < CNAME)" = "novatools.2bd.net"
          cp CNAME dist/CNAME
          test -f dist/CNAME

      - name: Ensure sitemap is in Pages artifact
        run: |
          test -f public/sitemap.xml
          mkdir -p dist
          cp public/sitemap.xml dist/sitemap.xml
          test -f dist/sitemap.xml
          grep -q 'https://novatools.2bd.net/' dist/sitemap.xml
          if grep -q 'https://novatools.net/' dist/sitemap.xml; then
            echo "ERROR: old novatools.net URLs found in deployed sitemap"
            exit 1
          fi
          if grep -RIl 'https://novatools.net/' dist public >/tmp/old-domain-files.txt 2>/dev/null; then
            echo "ERROR: old novatools.net URL found in deployable files:"
            cat /tmp/old-domain-files.txt
            exit 1
          fi

      - name: Create GitHub Pages SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify live production site
        timeout-minutes: 5
        env:
          SITE_URL: https://novatools.2bd.net
        run: |
          set -euo pipefail

          urls=(
            "/"
            "/tools"
            "/tools/calculator"
            "/tools/password-generator"
            "/tools/qr-generator"
            "/tools/json-formatter"
          )

          for path in "${urls[@]}"; do
            ok=0
            for attempt in {1..12}; do
              echo "Checking ${SITE_URL}${path} (attempt ${attempt}/12)"
              if curl --fail --silent --show-error --location \
                --connect-timeout 10 --max-time 30 \
                -H "Cache-Control: no-cache" \
                "${SITE_URL}${path}" \
                | grep -q "NOVA TOOLS"; then
                ok=1
                break
              fi
              sleep 5
            done

            if [ "${ok}" -ne 1 ]; then
              echo "Production smoke test failed for ${SITE_URL}${path}"
              exit 1
            fi
          done

          for asset in /robots.txt /sitemap.xml /manifest.json /favicon.svg /og-image.png; do
            echo "Checking ${SITE_URL}${asset}"
            curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              -H "Cache-Control: no-cache" \
              "${SITE_URL}${asset}" >/dev/null
          done

          echo "Production smoke test passed."

# Pages deployment trigger
# Reliability trigger: redeploy on every main-branch push.
