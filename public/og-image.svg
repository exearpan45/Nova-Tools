<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle grid decorative lines -->
  <g stroke="#27272a" stroke-width="1" opacity="0.4">
    <line x1="120" y1="0" x2="120" y2="630" />
    <line x1="360" y1="0" x2="360" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="840" y1="0" x2="840" y2="630" />
    <line x1="1080" y1="0" x2="1080" y2="630" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="510" x2="1200" y2="510" />
  </g>

  <!-- Centered Content -->
  <g transform="translate(600, 240)">
    <!-- Star Logo -->
    <g transform="translate(-48, -120)">
      <rect width="96" height="96" rx="22" fill="#18181b" stroke="#27272a" stroke-width="2" />
      <path d="M48 18 L55.5 40.5 L78 48 L55.5 55.5 L48 78 L40.5 55.5 L18 48 L40.5 40.5 Z" fill="url(#blueGlow)" />
      <circle cx="48" cy="48" r="7" fill="#ffffff" />
    </g>

    <!-- Main Title -->
    <text x="0" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#fafafa" text-anchor="middle" letter-spacing="-1">
      NOVA TOOLS
    </text>

    <!-- Tagline -->
    <text x="0" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#a1a1aa" text-anchor="middle">
      Simple tools. Done well.
    </text>

    <!-- Feature Badges -->
    <g transform="translate(0, 160)">
      <!-- Badge 1: 100% Client-Side -->
      <rect x="-260" y="-18" width="160" height="36" rx="18" fill="#27272a" />
      <text x="-180" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#e4e4e7" text-anchor="middle">
        100% Client-Side
      </text>

      <!-- Badge 2: Fast & Free -->
      <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#27272a" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#e4e4e7" text-anchor="middle">
        Zero Data Tracking
      </text>

      <!-- Badge 3: 15 Everyday Tools -->
      <rect x="100" y="-18" width="160" height="36" rx="18" fill="#27272a" />
      <text x="180" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#e4e4e7" text-anchor="middle">
        15 Free Utilities
      </text>
    </g>

    <!-- Domain link -->
    <text x="0" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#3b82f6" text-anchor="middle" letter-spacing="1">
      https://novatools.2bd.net
    </text>
  </g>
</svg>
